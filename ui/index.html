<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#f2f1ec">
    <title>Equatorium</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Equatorium 首页">
        <svg aria-hidden="true" viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="15"></circle>
          <path d="M9 20h22M20 9c4 3 6 6.7 6 11s-2 8-6 11c-4-3-6-6.7-6-11s2-8 6-11Z"></path>
        </svg>
        <span>Equatorium</span>
      </a>
    </header>

    <main class="workspace">
      <section class="panel" aria-labelledby="workspace-title">
        <h1 id="workspace-title" class="visually-hidden">解释标准表达式</h1>

        <form id="expression-form" novalidate>
          <label class="expression-field">
            <span class="visually-hidden">表达式</span>
            <textarea id="expression" rows="2" maxlength="8192" spellcheck="false" required placeholder="0 9 * * 1-5"></textarea>
          </label>
          <div class="form-actions">
            <div class="examples" aria-label="填入示例">
              <button type="button" data-example="semver">^3.2.0</button>
              <button type="button" data-example="cron">Cron</button>
              <button type="button" data-example="cidr">CIDR</button>
              <button type="button" data-example="permission">4755</button>
            </div>
            <button class="primary-action" id="submit-button" type="submit">
              <span>解释</span>
            </button>
          </div>
          <p class="form-error" id="form-error" role="alert" hidden></p>
        </form>

        <section class="result-area" id="result-area" hidden>
          <div class="result-heading" id="result-heading" hidden>
            <div>
              <h2 id="result-title"></h2>
            </div>
          </div>
          <div id="result-content" hidden aria-live="polite"></div>
        </section>
      </section>
    </main>
  </body>
</html>
